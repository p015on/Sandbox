<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ostatni Liść</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one-screen game — compact header, full-height canvas tree, result card over the canvas, controls bar below */
:root{
  --sky:#dce5ea; --sky2:#c7d4dc; --ink:#24303a; --muted:#5d6b76;
  --bark:#4a3a30; --ground:#b9c6cc; --card:#f6f8f9; --accent:#c9572c; --mark:#1f2a33;
  --display:"Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#141b23; --sky2:#1d2833; --ink:#e7edf1; --muted:#97a6b2;
  --bark:#3a2d25; --ground:#26323c; --card:#1f2a34; --accent:#ec7a45; --mark:#f4f7f9; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#141b23; --sky2:#1d2833; --ink:#e7edf1; --muted:#97a6b2;
  --bark:#3a2d25; --ground:#26323c; --card:#1f2a34; --accent:#ec7a45; --mark:#f4f7f9; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;
  display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior:none}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 16px 4px}
h1{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1;margin:0;color:var(--accent);letter-spacing:.01em}
.sub{font-size:.8rem;color:var(--muted);margin-top:4px}
.stats{display:flex;gap:14px;font-variant-numeric:tabular-nums;text-align:right}
.stat b{display:block;font-size:1.35rem;font-weight:800;line-height:1}
.stat span{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hint{padding:0 16px;font-size:.85rem;color:var(--muted);min-height:2.6em}
.legend{display:flex;align-items:center;gap:6px;padding:4px 16px 0;font-size:.72rem;color:var(--muted)}
.legend i{width:14px;height:9px;border-radius:9px 1px 9px 1px;display:inline-block}
#wrap{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
.bar{display:flex;gap:8px;padding:8px 16px 14px;flex-wrap:wrap}
button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:10px 16px;cursor:pointer;
  background:var(--card);color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.08)}
button.primary{background:var(--accent);color:#fff}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{outline:2px solid var(--accent)}
#result{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:360px;margin:auto;
  background:var(--card);border-radius:20px;padding:22px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.25)}
#result h2{font-family:var(--display);font-weight:400;font-size:1.8rem;margin:0 0 6px;color:var(--accent);text-wrap:balance}
#result p{margin:0 0 16px;color:var(--muted)}
#result .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <div>
    <h1>Ostatni Liść</h1>
    <div class="sub" id="mode-label">Drzewo dnia</div>
  </div>
  <div class="stats">
    <div class="stat"><b id="s-left">0</b><span>liści</span></div>
    <div class="stat"><b id="s-moves">0</b><span>ruchów</span></div>
    <div class="stat"><b id="s-best">–</b><span>rekord</span></div>
  </div>
</header>
<div class="hint" id="hint"></div>
<div class="legend" aria-label="Siła chwytu liści">
  <span>słaby</span>
  <i style="background:#d8c27e"></i><i style="background:#e9a63a"></i><i style="background:#e0712c"></i><i style="background:#c4412a"></i><i style="background:#8e2a1c"></i>
  <span>mocny</span>
</div>
<div id="wrap">
  <canvas id="c" aria-label="Drzewo z liśćmi"></canvas>
  <div id="result" hidden>
    <h2 id="r-title"></h2>
    <p id="r-text"></p>
    <div class="row">
      <button class="primary" id="r-again">Jeszcze raz</button>
      <button id="r-share">Kopiuj wynik</button>
    </div>
  </div>
</div>
<div class="bar">
  <button id="b-nums" aria-pressed="false">Liczby</button>
  <button id="b-daily" aria-pressed="true">Drzewo dnia</button>
  <button id="b-random" aria-pressed="false">Losowe</button>
  <button id="b-restart">Od nowa</button>
</div>

<script>
(() => {
const W=400, H=600, GROUND=575;
const NEAR=34, FAR=68;                 // tap damage rings: 2 inside NEAR, 1 inside FAR
const PULL=[28,62,100], PULL_MAX=125;  // slingshot pull length needed for strength 1, 2, 3
const GRIP_COL=["","#d8c27e","#e9a63a","#e0712c","#c4412a","#8e2a1c"];
const HINT="Stuknij liść, by go zerwać. Złap gałąź i odciągnij jak procę, by nią potrząsnąć. Zostaw dokładnie jeden liść.";
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function todayKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }
function plural(n){ return n===1?"liść": (n%10>=2&&n%10<=4&&(n%100<12||n%100>14))?"liście":"liści"; }

let mode="daily", seed=hash(todayKey()), branches=[], leaves=[], fallen=[], pile=[], moves=0, over=false;
let showNums=false, jolt=0, holding=null, pull=null, spring=null, lastMove=null;

function bestKey(){ return mode==="daily" ? "ol-pull-best-"+todayKey() : null; }
function pickGrip(r){ return r<.25?1 : r<.5?2 : r<.72?3 : r<.88?4 : 5; }

function build(){
  const R=rng(seed);
  branches=[]; leaves=[]; fallen=[]; pile=[]; moves=0; over=false; lastMove=null; pull=null; spring=null; holding=null;
  function grow(x,y,ang,len,w,depth,parent){
    const x2=x+Math.cos(ang)*len, y2=y+Math.sin(ang)*len, id=branches.length;
    branches.push({x,y,x2,y2,w,id,parent,kids:[]});
    if(parent>=0) branches[parent].kids.push(id);
    if(depth>=2){
      const n=depth>=4?3:2;
      for(let i=0;i<n;i++){
        const t=0.45+R()*0.55, side=R()<.5?-1:1;
        leaves.push({ax:x+(x2-x)*t, ay:y+(y2-y)*t, ang:ang+side*(0.6+R()*0.9), size:11+R()*6,
          grip:pickGrip(R()), ph:R()*6.28, wob:0, on:true, branch:id});
      }
    }
    if(depth<5){
      const kids=depth<2?3:2;
      for(let k=0;k<kids;k++){
        const spread=(k-(kids-1)/2)*(0.55+R()*0.25)+(R()-.5)*0.3;
        grow(x2,y2,ang+spread,len*(0.68+R()*0.12),w*0.66,depth+1,id);
      }
    }
  }
  grow(W/2,GROUND,-Math.PI/2+(R()-.5)*0.08,120,18,0,-1);
  leaves=leaves.filter((l,i)=>!leaves.slice(0,i).some(o=>Math.hypot(o.ax-l.ax,o.ay-l.ay)<9));
  while(leaves.length>40) leaves.splice(Math.floor(R()*leaves.length),1);
  for(const l of leaves){ l.cx=l.ax+Math.cos(l.ang)*l.size*0.8; l.cy=l.ay+Math.sin(l.ang)*l.size*0.8; }
  // every branch knows its whole subtree, so pulling it shakes exactly the leaves that hang from it
  for(let i=branches.length-1;i>=0;i--){ const b=branches[i]; b.sub=new Set([i]); for(const k of b.kids) for(const s of branches[k].sub) b.sub.add(s); }
  $("result").hidden=true; $("hint").textContent=HINT;
  updateStats();
}

const alive=()=>leaves.filter(l=>l.on);
function updateStats(){
  $("s-left").textContent=alive().length; $("s-moves").textContent=moves;
  const k=bestKey(), b=k?store(k):null; $("s-best").textContent=b?b:"–";
}

// One rule set for both preview and the real move, so the preview is always exact.
function tapDamage(d){ return d<NEAR?2 : d<FAR?1 : 0; }
function effects(action){
  const fall=new Set(), dmg=new Map();
  if(action.type==="tap"){
    fall.add(action.leaf);
    for(const l of alive()){ if(l===action.leaf) continue;
      const v=tapDamage(Math.hypot(l.ax-action.leaf.ax,l.ay-action.leaf.ay));
      if(v){ dmg.set(l,v); if(l.grip<=v) fall.add(l); } }
  } else if(action.s>0){
    const sub=branches[action.branch].sub;
    for(const l of alive()){ if(!sub.has(l.branch)) continue; dmg.set(l,action.s); if(l.grip<=action.s) fall.add(l); }
  }
  return {fall,dmg};
}

function apply(action){
  if(over) return;
  const {fall,dmg}=effects(action);
  moves++; jolt=action.type==="tap"?0.5:0.3+action.s*0.2;
  const ox=action.type==="tap"?action.leaf.ax:branches[action.branch].x2, oy=action.type==="tap"?action.leaf.ay:branches[action.branch].y2;
  for(const [l,v] of dmg){ l.grip-=v; l.wob=1; }
  for(const l of fall){ const col=GRIP_COL[Math.max(1,l.grip+(dmg.get(l)||0))]; l.on=false;
    const d=Math.hypot(l.ax-ox,l.ay-oy), delay=action.type==="tap"&&l===action.leaf?0:80+d*2.5;
    setTimeout(()=>fallen.push({x:l.ax,y:l.ay,vx:(l.ax-ox)*0.004,vy:0,rot:l.ang,vr:(l.ax>ox?1:-1)*0.04,
      size:l.size,col,ph:l.ph}),delay); }
  lastMove={type:action.type,s:action.s,count:fall.size};
  updateStats();
  const n=alive().length;
  if(n<=1){ over=true; setTimeout(()=>finish(n),1300); }
}

function finish(n){
  const win=n===1;
  $("r-title").textContent=win?"Został jeden!":"Gołe drzewo";
  if(win){
    const k=bestKey(); let rec="";
    if(k){ const b=+store(k)||0; if(!b||moves<b){ store(k,String(moves)); rec=" Nowy rekord dnia."; } }
    $("r-text").textContent="Ostatni liść trzyma się gałęzi. Ruchy: "+moves+"."+rec;
  } else {
    const what=lastMove.type==="tap"?"Ostatnie stuknięcie":"Ostatnie naciągnięcie (siła "+lastMove.s+")";
    $("r-text").textContent=what+" strąciło naraz "+lastMove.count+" "+plural(lastMove.count)+". Obrysowane liście w podglądzie to te, które spadną.";
  }
  $("r-share").dataset.text=(win?"🍂 Ostatni liść: 1 liść w "+moves+" ruchach":"🍂 Ostatni liść: drzewo wygrało ze mną")+(mode==="daily"?" (drzewo dnia "+todayKey()+")":"");
  $("result").hidden=false; updateStats();
}

// ---------- input ----------
function toLogical(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left-ox)/scale,(e.clientY-r.top-oy)/scale]; }
function hitLeaf(px,py){ let best=null,bd=24;
  for(const l of alive()){ const d=Math.hypot(l.cx-px,l.cy-py); if(d<bd){bd=d;best=l;} } return best; }
function hitBranch(px,py){ let best=null,bd=1e9,pt=null;
  for(const b of branches){ const vx=b.x2-b.x, vy=b.y2-b.y, L=vx*vx+vy*vy;
    const t=Math.max(0,Math.min(1,((px-b.x)*vx+(py-b.y)*vy)/L)), qx=b.x+vx*t, qy=b.y+vy*t;
    const d=Math.hypot(px-qx,py-qy)-b.w/2; if(d<bd){bd=d;best=b;pt=[qx,qy];} }
  return bd<16?{b:best,ax:pt[0],ay:pt[1]}:null; }
function pullVec(){ let dx=pull.x-pull.ax, dy=pull.y-pull.ay; const d=Math.hypot(dx,dy);
  if(d>PULL_MAX){ dx*=PULL_MAX/d; dy*=PULL_MAX/d; } return [dx,dy,Math.min(d,PULL_MAX)]; }
function pullLevel(){ const d=pullVec()[2]; return d>=PULL[2]?3 : d>=PULL[1]?2 : d>=PULL[0]?1 : 0; }

cv.addEventListener("pointerdown",e=>{
  if(over) return; const [x,y]=toLogical(e);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const l=hitLeaf(x,y);
  if(l){ holding={leaf:l,x,y,t:performance.now(),cancel:false}; return; }
  const h=hitBranch(x,y);
  if(h){ pull={branch:h.b.id,ax:h.ax,ay:h.ay,x,y}; spring=null; setHint(); }
});
cv.addEventListener("pointermove",e=>{ const [x,y]=toLogical(e);
  if(pull){ pull.x=x; pull.y=y; setHint(); return; }
  if(!holding) return; const moved=Math.hypot(x-holding.x,y-holding.y)>30;
  if(moved!==holding.cancel){ holding.cancel=moved; setHint(); } });
cv.addEventListener("pointerup",()=>{
  if(pull){ const s=pullLevel(), [dx,dy]=pullVec();
    if(s>0) apply({type:"pull",branch:pull.branch,s});
    spring={branch:pull.branch,ax:pull.ax,ay:pull.ay,dx,dy,t:performance.now()}; pull=null; setHint(); return; }
  if(holding&&!holding.cancel) apply({type:"tap",leaf:holding.leaf}); holding=null; setHint(); });
cv.addEventListener("pointercancel",()=>{ holding=null; pull=null; setHint(); });

function setHint(){
  const h=$("hint");
  if(pull){ const s=pullLevel();
    h.textContent = s ? "Siła "+s+" z 3. Puść, żeby potrząsnąć. Obrysowane liście spadną." : "Odciągnij dalej, żeby naciągnąć gałąź. Puść tutaj, żeby anulować."; }
  else if(holding&&holding.cancel) h.textContent="Puść teraz, a ruch zostanie anulowany.";
  else if(holding) h.textContent="Puść, żeby zerwać. Pełny obrys spadnie, przerywany straci chwyt. Odsuń palec, żeby anulować.";
  else h.textContent=HINT;
}

// ---------- drawing ----------
let theme={}, frame=0;
function readTheme(){ const s=getComputedStyle(document.documentElement);
  for(const k of ["sky","sky2","bark","ground","mark","accent","card"]) theme[k]=s.getPropertyValue("--"+k).trim(); }
let scale=1, ox=0, oy=0, dpr=1;
function resize(){
  const r=cv.getBoundingClientRect(); dpr=Math.min(devicePixelRatio||1,2);
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  scale=Math.min(r.width/W,r.height/H); ox=(r.width-W*scale)/2; oy=(r.height-H*scale);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy);
}
function leafShape(size){ ctx.beginPath(); ctx.moveTo(0,0);
  ctx.quadraticCurveTo(size*0.5,-size*0.55,size*1.6,0); ctx.quadraticCurveTo(size*0.5,size*0.55,0,0); ctx.closePath(); }
function drawLeaf(x,y,rot,size,col,grip,mark){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  if(grip===1) ctx.translate(2,0); // cracked stem: the leaf hangs off its point
  leafShape(size); ctx.fillStyle=col; ctx.fill();
  ctx.strokeStyle="rgba(50,20,8,.35)"; ctx.lineWidth=0.8; ctx.beginPath(); ctx.moveTo(1,0); ctx.lineTo(size*1.3,0); ctx.stroke();
  if(grip===1){ ctx.strokeStyle="rgba(50,20,8,.6)"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(-2,-2); ctx.lineTo(0,2); ctx.stroke(); }
  if(mark){ leafShape(size); ctx.strokeStyle=theme.mark; ctx.lineWidth=mark==="fall"?2.4:1.3;
    ctx.setLineDash(mark==="fall"?[]:[3,2]); ctx.stroke(); ctx.setLineDash([]); }
  ctx.restore();
}

// Bending: points in the pulled subtree move toward the finger, more the further they are from the subtree's base.
function bender(t){
  let src=null, vx=0, vy=0;
  if(pull){ const [dx,dy]=pullVec(); src=pull; vx=dx; vy=dy; }
  else if(spring && !reduce){ const age=(t-spring.t)/1000, k=Math.exp(-age*3.2)*Math.cos(age*18);
    if(Math.abs(k)<0.01&&age>0.4){ spring=null; } else { src=spring; vx=spring.dx*k; vy=spring.dy*k; } }
  if(!src) return null;
  const b=branches[src.branch], reach=Math.max(20,Math.hypot(src.ax-b.x,src.ay-b.y));
  return {sub:b.sub, f:(x,y)=>{ const f=Math.min(1.5,Math.hypot(x-b.x,y-b.y)/reach)*0.45; return [x+vx*f,y+vy*f]; }};
}

function draw(t){
  if(frame++%30===0) readTheme();
  const g=ctx.createLinearGradient(0,-oy/scale,0,H); g.addColorStop(0,theme.sky2); g.addColorStop(1,theme.sky);
  ctx.fillStyle=g; ctx.fillRect(-ox/scale-2,-oy/scale-2,W+2*ox/scale+4,H+oy/scale+4);
  ctx.fillStyle=theme.ground; ctx.beginPath(); ctx.ellipse(W/2,GROUND+30,W*0.75,42,0,0,Math.PI*2); ctx.fill();

  let prev=null, centre=null;
  if(holding && !holding.cancel && performance.now()-holding.t>200){ prev=effects({type:"tap",leaf:holding.leaf}); centre=holding.leaf; }
  if(pull) prev=effects({type:"pull",branch:pull.branch,s:pullLevel()});
  const bend=bender(t);
  const P=(x,y,bid)=> bend&&bend.sub.has(bid) ? bend.f(x,y) : [x,y];

  const sx=jolt>0&&!reduce?Math.sin(t/22)*jolt*0.03:0; jolt=Math.max(0,jolt-0.03);
  ctx.save(); ctx.translate(W/2,GROUND); ctx.rotate(sx); ctx.translate(-W/2,-GROUND);
  ctx.strokeStyle=theme.bark; ctx.lineCap="round";
  for(const b of branches){ const [x1,y1]=P(b.x,b.y,b.id), [x2,y2]=P(b.x2,b.y2,b.id);
    ctx.lineWidth=b.w; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
  if(centre){ ctx.strokeStyle=theme.mark; ctx.globalAlpha=0.25; ctx.lineWidth=1;
    for(const r of [NEAR,FAR]){ ctx.beginPath(); ctx.arc(centre.ax,centre.ay,r,0,Math.PI*2); ctx.stroke(); }
    ctx.globalAlpha=1; }
  const wind=reduce?0:1;
  for(const l of leaves){ if(!l.on) continue;
    const weak=(5-l.grip)/4;
    const idle=Math.sin(t/(420-weak*260)+l.ph)*(0.02+weak*0.2)*wind;
    const w=Math.sin(t/40+l.ph)*l.wob*0.5*wind; l.wob*=0.94;
    let mark=null; if(prev){ if(prev.fall.has(l)) mark="fall"; else if(prev.dmg.has(l)) mark="dmg"; }
    const [x,y]=P(l.ax,l.ay,l.branch);
    drawLeaf(x,y,l.ang+idle+w,l.size,GRIP_COL[l.grip],l.grip,mark);
    if(showNums){ const [cx,cy]=P(l.cx,l.cy,l.branch); ctx.fillStyle=theme.mark; ctx.font="800 10px Nunito, sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(l.grip,cx,cy); }
  }
  ctx.restore();

  if(pull) drawSling();

  for(const p of pile) drawLeaf(p.x,p.y,p.rot,p.size,p.col,2,null);
  for(let i=fallen.length-1;i>=0;i--){ const f=fallen[i];
    f.vy=Math.min(f.vy+0.05,1.6); f.ph+=0.05;
    f.x+=f.vx+Math.sin(f.ph)*0.9; f.y+=f.vy; f.rot+=f.vr+Math.cos(f.ph)*0.02;
    const floor=GROUND+8+((Math.abs(f.x)*7)%14);
    if(f.y>=floor){ f.y=floor; pile.push(f); fallen.splice(i,1); if(pile.length>80) pile.shift(); }
    drawLeaf(f.x,f.y,f.rot,f.size,f.col,2,null); }
  requestAnimationFrame(draw);
}

// Slingshot band from the grab point to the finger, plus a 3-step power meter next to the finger.
function drawSling(){
  const [dx,dy,d]=pullVec(), s=pullLevel(), fx=pull.ax+dx, fy=pull.ay+dy;
  ctx.strokeStyle=theme.accent; ctx.lineWidth=3; ctx.setLineDash(s?[]:[5,4]);
  ctx.beginPath(); ctx.moveTo(pull.ax,pull.ay); ctx.lineTo(fx,fy); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=theme.accent; ctx.beginPath(); ctx.arc(pull.ax,pull.ay,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(fx,fy,7,0,Math.PI*2); ctx.fill();
  const mx=Math.max(8,Math.min(W-78,fx+16)), my=Math.max(10,fy-40);
  ctx.fillStyle=theme.card; ctx.globalAlpha=0.92; ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(mx-6,my-6,82,32,10); else ctx.rect(mx-6,my-6,82,32);
  ctx.fill(); ctx.globalAlpha=1;
  for(let i=0;i<3;i++){
    const lo=i?PULL[i-1]:0, fill=Math.min(1,Math.max(0,(d-lo)/(PULL[i]-lo)));
    ctx.fillStyle=theme.mark; ctx.globalAlpha=0.15; ctx.fillRect(mx+i*24,my,20,8); ctx.globalAlpha=1;
    ctx.fillStyle=theme.accent; ctx.fillRect(mx+i*24,my,20*fill,8);
  }
  ctx.fillStyle=theme.mark; ctx.font="800 11px Nunito, sans-serif"; ctx.textAlign="left"; ctx.textBaseline="top";
  ctx.fillText(s?"siła "+s:"anuluj",mx,my+12);
}

// ---------- controls ----------
function setMode(m){ mode=m; $("b-daily").setAttribute("aria-pressed",m==="daily"); $("b-random").setAttribute("aria-pressed",m==="random");
  $("mode-label").textContent=m==="daily"?"Drzewo dnia":"Losowe drzewo";
  seed=m==="daily"?hash(todayKey()):(Math.random()*1e9)|0; build(); }
$("b-daily").onclick=()=>setMode("daily");
$("b-random").onclick=()=>setMode("random");
$("b-restart").onclick=build;
$("r-again").onclick=build;
$("b-nums").onclick=e=>{ showNums=!showNums; e.currentTarget.setAttribute("aria-pressed",showNums); };
$("r-share").onclick=async e=>{ const btn=e.currentTarget, txt=btn.dataset.text||"";
  try{ await navigator.clipboard.writeText(txt); btn.textContent="Skopiowano"; }
  catch(err){ $("r-text").textContent=txt; btn.textContent="Zaznacz tekst wyżej"; }
  setTimeout(()=>{ btn.textContent="Kopiuj wynik"; },1800); };
addEventListener("resize",resize);
readTheme(); resize(); build(); requestAnimationFrame(draw);
})();
</script>
