<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Literowe Miasteczka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700;800&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: map game — compact header with stats, the word being spelled in a pill, the map canvas, a bar of controls */
:root{
  --land:#e6ecdf; --land2:#dbe3d3; --ink:#26302b; --muted:#66736b; --road:#4b5560; --tile:#ffffff; --tile-ink:#7a857f;
  --card:#f7f9f5; --accent:#e0623f; --ok:#2f9e6f; --bad:#d4483b;
  --display:"Lexend", "Avenir Next", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --land:#1b221e; --land2:#212a25; --ink:#e8eee9; --muted:#9aa79f; --road:#aeb8c2; --tile:#2b3530; --tile-ink:#9aa79f;
  --card:#26302b; --accent:#f07a55; --ok:#4fc08d; --bad:#ef6b5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --land:#1b221e; --land2:#212a25; --ink:#e8eee9; --muted:#9aa79f; --road:#aeb8c2; --tile:#2b3530; --tile-ink:#9aa79f;
  --card:#26302b; --accent:#f07a55; --ok:#4fc08d; --bad:#ef6b5e; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--land);color:var(--ink);font-family:var(--body);overflow:hidden;margin:0;
  display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior:none}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 16px 0}
h1{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1.05;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.stats{display:flex;gap:14px;font-variant-numeric:tabular-nums;text-align:right}
.stat b{display:block;font-size:1.25rem;font-weight:800;line-height:1}
.stat span{font-size:.64rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.wordrow{display:flex;justify-content:center;padding:8px 16px 0;min-height:44px}
#word{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:.14em;text-transform:uppercase;
  padding:6px 16px;border-radius:999px;background:var(--card);min-width:3em;text-align:center;transition:background .2s,color .2s}
#word.empty{color:var(--muted);font-size:.85rem;letter-spacing:.02em;text-transform:none;font-family:var(--body);font-weight:600;padding-block:9px}
#word.ok{background:var(--ok);color:#fff}
#word.bad{background:var(--bad);color:#fff}
.msg{text-align:center;font-size:.82rem;color:var(--muted);padding:4px 16px 0;min-height:1.4em}
#wrap{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.bar{display:flex;gap:8px;padding:8px 16px 14px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:10px 16px;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.08)}
button.primary{background:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border-radius:20px;padding:20px;max-width:340px;width:100%;text-align:center;box-shadow:0 18px 44px rgba(0,0,0,.22)}
.card h2{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0 0 6px;color:var(--accent);text-wrap:balance}
.card p{margin:0 0 14px;color:var(--muted);line-height:1.45}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stars{font-size:1.6rem;letter-spacing:.2em;color:var(--accent);margin-bottom:4px}
</style>
</head>
<body>

<header>
  <h1>Literowe <span>Miasteczka</span></h1>
  <div class="stats">
    <div class="stat"><b id="s-level">1</b><span>mapa</span></div>
    <div class="stat"><b id="s-lit">0/0</b><span>wioski</span></div>
    <div class="stat"><b id="s-words">0</b><span>słowa</span></div>
  </div>
</header>
<div class="wordrow"><div id="word" class="empty">Przeciągnij palcem przez wioski, żeby ułożyć słowo</div></div>
<div class="msg" id="msg">Połącz drogami wszystkie wioski. Drogi nie mogą się przecinać.</div>
<div id="wrap">
  <canvas id="c" aria-label="Mapa z wioskami oznaczonymi literami"></canvas>
  <div class="overlay" id="result" hidden>
    <div class="card">
      <div class="stars" id="r-stars"></div>
      <h2 id="r-title">Wszystkie wioski połączone!</h2>
      <p id="r-text"></p>
      <div class="row"><button class="primary" id="b-next">Następna mapa</button><button id="b-retry">Jeszcze raz</button></div>
    </div>
  </div>
</div>
<div class="bar">
  <button id="b-undo" disabled>Cofnij drogę</button>
  <button id="b-hint">Podpowiedź</button>
  <button id="b-new">Inna mapa</button>
</div>

  if(a===c||a===d||b===c||b===d) return false;
  const o=(p,q,r)=>Math.sign((q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x));
  return o(a,b,c)!==o(a,b,d) && o(c,d,a)!==o(c,d,b) && o(a,b,c)!==0 && o(a,b,d)!==0; }
function segDist(p,a,b){ const vx=b.x-a.x, vy=b.y-a.y, L=vx*vx+vy*vy;
  const t=Math.max(0,Math.min(1,((p.x-a.x)*vx+(p.y-a.y)*vy)/L)); return Math.hypot(p.x-(a.x+vx*t),p.y-(a.y+vy*t)); }
// a new road segment is legal if it crosses no road and passes through no other village
function segOK(a,b,segs,vills){
  for(const s of segs){ if((s[0]===a&&s[1]===b)||(s[0]===b&&s[1]===a)) continue; if(cross(a,b,s[0],s[1])) return false; }
  for(const v of vills){ if(v===a||v===b) continue; if(segDist(v,a,b)<TILE+3) return false; }
  return true; }

// ---------- level generator: builds a solvable map from real words ----------
const COLS=5, ROWS=7, GX=W/COLS, GY=H/ROWS;
function generate(seed,nWords){
  const R=rng(seed);
  for(let attempt=0;attempt<60;attempt++){
    const cells=[]; for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++)
      cells.push({c,r,x:GX*(c+.5)+(R()-.5)*22,y:GY*(r+.5)+(R()-.5)*20,v:null});
    const at=(c,r)=>c>=0&&r>=0&&c<COLS&&r<ROWS?cells[r*COLS+c]:null;
    const vills=[], segs=[], sol=[], used=new Set();
    const nbrs=cell=>{ const out=[]; for(let dc=-1;dc<=1;dc++) for(let dr=-1;dr<=1;dr++){ if(!dc&&!dr) continue; const n=at(cell.c+dc,cell.r+dr); if(n) out.push(n);}
      for(let i=out.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; } return out; };
    // place letters word[k..] walking from cell `from` (already holding word[k-1]) into free cells
    function walk(from,letters,path,newSegs){
      if(!letters.length) return true;
      for(const n of nbrs(from)){ if(n.v||n.tmp||path.includes(n)) continue;
        const a=from.v||from, b=n;
        if(!segOK(a,b,segs.concat(newSegs),vills.concat(path))) continue;
        path.push(n); n.tmp=letters[0]; newSegs.push([a,b]);
        if(walk(n,letters.slice(1),path,newSegs)) return true;
        path.pop(); newSegs.pop(); delete n.tmp; }
      return false; }
    let tries=0;
    while(sol.length<nWords && tries<400){ tries++;
      let word, startCell;
      if(!vills.length){
        const pool=SOL.filter(w=>w.length>=4&&w.length<=5); word=pool[Math.floor(R()*pool.length)];
        startCell=cells[Math.floor(R()*cells.length)];
        const v={x:startCell.x,y:startCell.y,ch:word[0],lit:-1};
        const path=[], ns=[]; startCell.v=v;
        if(walk(startCell,[...word.slice(1)],path,ns)){ commit(word,[v],path,ns,startCell); } else { startCell.v=null; }
        continue;
      }
      const base=vills[Math.floor(R()*vills.length)];
      const pool=SOL.filter(w=>!used.has(w)&&w[0]===base.ch&&w.length>=3);
      if(!pool.length) continue;
      word=pool[Math.floor(R()*pool.length)];
      const path=[], ns=[];
      if(walk(base.cell,[...word.slice(1)],path,ns)) commit(word,[base],path,ns,null);
    }
    function commit(word,head,path,ns,startCell){
      if(startCell){ head[0].cell=startCell; vills.push(head[0]); }
      const vs=[head[0]];
      for(const cell of path){ const v={x:cell.x,y:cell.y,ch:cell.tmp,lit:-1,cell}; cell.v=v; delete cell.tmp; vills.push(v); vs.push(v); }
      for(let i=1;i<vs.length;i++) segs.push([vs[i-1],vs[i]]);
      sol.push({word,vs}); used.add(word);
    }
    if(sol.length===nWords) return {vills,sol};
  }
  return null;
}

// GEN-END
// ---------- state ----------
let level=1, seed=(Math.random()*1e9)|0, vills=[], sol=[], roads=[], drag=null, finger=null, flash=null, hints=0, hintMark=null;

function start(){
  const n=Math.min(6,2+level);
  let g=null; for(let k=0;k<20&&!g;k++) g=generate(seed+k*101,n);
  vills=g.vills; sol=g.sol; roads=[]; drag=null; hints=0; hintMark=null;
  $("result").hidden=true; setWord(); updateStats();
  $("msg").textContent= level===1 ? "Połącz drogami wszystkie wioski. Drogi nie mogą się przecinać." : "Mapa "+level+". Im mniej słów, tym więcej gwiazdek.";
}
function updateStats(){
  const lit=vills.filter(v=>v.lit>=0).length;
  $("s-level").textContent=level; $("s-lit").textContent=lit+"/"+vills.length; $("s-words").textContent=roads.length;
  $("b-undo").disabled=!roads.length;
}
function setWord(text,cls){ const w=$("word"); w.className=cls||"";
  if(text){ w.textContent=text; } else { w.className="empty"; w.textContent="Przeciągnij palcem przez wioski, żeby ułożyć słowo"; } }

function allSegs(){ const s=[]; for(const r of roads) for(let i=1;i<r.vs.length;i++) s.push([r.vs[i-1],r.vs[i]]); return s; }

function tryBuild(path){
  const word=path.map(v=>v.ch).join("");
  if(path.length<3) return fail(word,"Słowo musi mieć co najmniej 3 litery.");
  if(!VALID.has(word)) return fail(word,"Nie znam słowa „"+word+"”.");
  if(roads.some(r=>r.word===word)) return fail(word,"To słowo już jest na mapie.");
  const segs=allSegs(), ns=[];
  for(let i=1;i<path.length;i++){ const a=path[i-1], b=path[i];
    if(!segOK(a,b,segs.concat(ns),vills)) return fail(word, crossesVillage(a,b)?"Droga nie może przejeżdżać przez inną wioskę.":"Drogi nie mogą się przecinać.");
    ns.push([a,b]); }
  const color=COLORS[roads.length%COLORS.length];
  const road={word,vs:path.slice(),color,born:performance.now(),carts:[0, .5].slice(0,path.length>4?2:1).map(o=>({t:o,dir:1}))};
  roads.push(road);
  for(const v of path) if(v.lit<0) v.lit=roads.length-1;
  hintMark=null;
  setWord(word,"ok"); $("msg").textContent="Nowa droga: "+word.toUpperCase()+".";
  updateStats();
  if(vills.every(v=>v.lit>=0)) setTimeout(win,900);
}
function crossesVillage(a,b){ return vills.some(v=>v!==a&&v!==b&&segDist(v,a,b)<TILE+3); }
function fail(word,why){ setWord(word||"?","bad"); $("msg").textContent=why; flash={t:performance.now(),path:drag?drag.path.slice():[]}; }

function undo(){
  const r=roads.pop(); if(!r) return;
  for(const v of vills){ v.lit=-1; }
  roads.forEach((rd,i)=>{ for(const v of rd.vs) if(v.lit<0) v.lit=i; });
  setWord(); $("msg").textContent="Cofnięto drogę „"+r.word+"”."; updateStats();
}

function hint(){
  const segs=allSegs();
  // a solution word that is still buildable and lights something new
  const cand=sol.find(s=>!roads.some(r=>r.word===s.word) && s.vs.some(v=>v.lit<0) &&
    s.vs.every((v,i)=>i===0||segOK(s.vs[i-1],v,segs,vills)));
  if(!cand){ $("msg").textContent="Twoje drogi zablokowały przygotowane słowa. Spróbuj cofnąć ostatnią drogę."; return; }
  hints++; hintMark={v:cand.vs[0],t:performance.now()};
  const n=cand.word.length;
  $("msg").textContent="Zacznij od zaznaczonej wioski. Szukane słowo ma "+n+" "+(n<5?"litery":"liter")+".";
}

function win(){
  const base=sol.length, w=roads.length;
  let st = w<=base?3 : w===base+1?2 : 1; if(hints>0) st=Math.min(st,2);
  $("r-stars").textContent="★".repeat(st)+"☆".repeat(3-st);
  $("r-text").textContent="Użyte słowa: "+roads.map(r=>r.word.toUpperCase()).join(", ")+". "+
    (st===3?"Mniej się nie da.":"Trzy gwiazdki za połączenie wszystkiego w "+base+" "+(base<5?"słowach":"słowach")+" bez podpowiedzi.");
  $("result").hidden=false;
}

// ---------- input ----------
function toLogical(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left-ox)/scale,(e.clientY-r.top-oy)/scale]; }
function villAt(x,y,rad){ let best=null,bd=rad; for(const v of vills){ const d=Math.hypot(v.x-x,v.y-y); if(d<bd){bd=d;best=v;} } return best; }
cv.addEventListener("pointerdown",e=>{ if(!$("result").hidden) return; const [x,y]=toLogical(e);
  const v=villAt(x,y,HIT+4); if(!v) return; try{cv.setPointerCapture(e.pointerId);}catch(_){}
  drag={path:[v]}; finger=[x,y]; setWord(v.ch); });
cv.addEventListener("pointermove",e=>{ if(!drag) return; const [x,y]=toLogical(e); finger=[x,y];
  const v=villAt(x,y,HIT); if(!v) return;
  const p=drag.path;
  if(p.length>1&&v===p[p.length-2]){ p.pop(); }
  else if(!p.includes(v)){ p.push(v); }
  setWord(p.map(q=>q.ch).join("")); });
cv.addEventListener("pointerup",()=>{ if(!drag) return; const p=drag.path;
  if(p.length===1){ setWord(); } else tryBuild(p);
  drag=null; finger=null; });
cv.addEventListener("pointercancel",()=>{ drag=null; finger=null; setWord(); });

// ---------- drawing ----------
let theme={}, frame=0, scale=1, ox=0, oy=0;
function readTheme(){ const s=getComputedStyle(document.documentElement);
  for(const k of ["land","land2","road","tile","tile-ink","ink","accent","bad"]) theme[k]=s.getPropertyValue("--"+k).trim(); }
function resize(){ const r=cv.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  scale=Math.min(r.width/W,r.height/H); ox=(r.width-W*scale)/2; oy=(r.height-H*scale)/2;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy); }

function polyLen(vs){ let L=0; for(let i=1;i<vs.length;i++) L+=Math.hypot(vs[i].x-vs[i-1].x,vs[i].y-vs[i-1].y); return L; }
function pointAt(vs,d){ for(let i=1;i<vs.length;i++){ const a=vs[i-1], b=vs[i], l=Math.hypot(b.x-a.x,b.y-a.y);
  if(d<=l) return [a.x+(b.x-a.x)*d/l, a.y+(b.y-a.y)*d/l, Math.atan2(b.y-a.y,b.x-a.x)]; d-=l; }
  const a=vs[vs.length-2], b=vs[vs.length-1]; return [b.x,b.y,Math.atan2(b.y-a.y,b.x-a.x)]; }

let last=0;
function draw(t){
  const dt=Math.min(50,t-(last||t)); last=t;
  if(frame++%30===0) readTheme();
  ctx.fillStyle=theme.land; ctx.fillRect(-ox/scale,-oy/scale,W+2*ox/scale,H+2*oy/scale);
  // soft field patches for a map feel
  ctx.fillStyle=theme.land2;
  for(let i=0;i<9;i++){ const px=(i*137%W), py=(i*211%H); ctx.beginPath(); ctx.ellipse(px,py,60,34,i,0,7); ctx.fill(); }

  const now=performance.now();
  // roads: built ones, drawn in with a short grow animation
  ctx.lineCap="round"; ctx.lineJoin="round";
  for(const r of roads){
    const L=polyLen(r.vs), grow=reduce?1:Math.min(1,(now-r.born)/450);
    ctx.strokeStyle=theme.road; ctx.lineWidth=11; strokePoly(r.vs,L*grow);
    ctx.strokeStyle=r.color; ctx.globalAlpha=.9; ctx.lineWidth=3; strokePoly(r.vs,L*grow); ctx.globalAlpha=1;
  }
  // carts
  for(const r of roads){ const L=polyLen(r.vs); if(now-r.born<450) continue;
    for(const c of r.carts){ if(!reduce){ c.t+=c.dir*dt*0.05/L; if(c.t>1){c.t=1;c.dir=-1;} if(c.t<0){c.t=0;c.dir=1;} }
      const [x,y,a]=pointAt(r.vs,c.t*L);
      ctx.save(); ctx.translate(x,y); ctx.rotate(a+(c.dir<0?Math.PI:0));
      ctx.fillStyle=r.color; ctx.beginPath(); ctx.roundRect?ctx.roundRect(-6,-4,12,8,3):ctx.rect(-6,-4,12,8); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.85)"; ctx.fillRect(3,-3,2,6); ctx.restore(); } }

  // the path being dragged
  if(drag){ const p=drag.path; ctx.strokeStyle=theme.accent; ctx.lineWidth=7; ctx.globalAlpha=.55;
    ctx.beginPath(); ctx.moveTo(p[0].x,p[0].y); for(const v of p) ctx.lineTo(v.x,v.y); if(finger) ctx.lineTo(finger[0],finger[1]); ctx.stroke(); ctx.globalAlpha=1; }
  // a rejected path flashes red for a moment
  if(flash && now-flash.t<700 && flash.path.length>1){ const a=1-(now-flash.t)/700; ctx.strokeStyle=theme.bad; ctx.globalAlpha=a; ctx.lineWidth=6;
    ctx.beginPath(); flash.path.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y)); ctx.stroke(); ctx.globalAlpha=1; }

  // villages
  for(const v of vills){
    const inPath=drag&&drag.path.includes(v), lit=v.lit>=0, col=lit?roads[v.lit].color:null;
    const s=inPath?TILE+3:TILE;
    if(hintMark&&hintMark.v===v&&!reduce){ const k=(now-hintMark.t)/600%1; ctx.strokeStyle=theme.accent; ctx.globalAlpha=1-k; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(v.x,v.y,s+6+k*14,0,7); ctx.stroke(); ctx.globalAlpha=1; }
    // house: square body with a roof
    ctx.fillStyle="rgba(0,0,0,.12)"; ctx.beginPath(); ctx.roundRect?ctx.roundRect(v.x-s+2,v.y-s+4,2*s,2*s,7):ctx.rect(v.x-s+2,v.y-s+4,2*s,2*s); ctx.fill();
    ctx.fillStyle=lit?col:theme.tile; ctx.beginPath(); ctx.roundRect?ctx.roundRect(v.x-s,v.y-s,2*s,2*s,7):ctx.rect(v.x-s,v.y-s,2*s,2*s); ctx.fill();
    if(inPath){ ctx.strokeStyle=theme.accent; ctx.lineWidth=3; ctx.stroke(); }
    ctx.fillStyle=lit?"#fff":theme["tile-ink"];
    ctx.font="700 "+(s*1.05)+"px Lexend, system-ui, sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(v.ch.toUpperCase(),v.x,v.y+1);
  }
  requestAnimationFrame(draw);
}
function strokePoly(vs,len){ ctx.beginPath(); ctx.moveTo(vs[0].x,vs[0].y); let left=len;
  for(let i=1;i<vs.length&&left>0;i++){ const a=vs[i-1], b=vs[i], l=Math.hypot(b.x-a.x,b.y-a.y), k=Math.min(1,left/l);
    ctx.lineTo(a.x+(b.x-a.x)*k,a.y+(b.y-a.y)*k); left-=l; } ctx.stroke(); }

// ---------- controls ----------
$("b-undo").onclick=undo;
$("b-hint").onclick=hint;
$("b-new").onclick=()=>{ seed=(Math.random()*1e9)|0; start(); };
$("b-next").onclick=()=>{ level++; seed=(Math.random()*1e9)|0; start(); };
$("b-retry").onclick=()=>{ start(); };
addEventListener("resize",resize);
readTheme(); resize(); start(); requestAnimationFrame(draw);
})();
</script>

</body>
</html>
